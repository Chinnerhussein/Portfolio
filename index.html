<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chiner — Developer</title>
  <meta name="description" content="Portfolio of Chiner, developer.">
  <meta name="theme-color" content="#06080b">
  <script>document.documentElement.classList.add('js', 'is-loading');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:opsz,wght@9..40,400..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#about">Skip to content</a>

  <!-- Intro loader (removed by script.js once it finishes) -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader__top mono"><span id="loaderName">Chiner</span><span>Portfolio</span></div>
    <div class="loader__count" id="loaderCount">000</div>
    <div class="loader__bar"><span id="loaderBar"></span></div>
  </div>

  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
  <div class="progress" aria-hidden="true"><span id="progress"></span></div>

  <header class="nav" id="nav">
    <div class="wrap nav__inner">
      <a class="nav__logo" href="#top"><span id="navName">Chiner</span><i>.</i></a>
      <nav class="nav__links" aria-label="Main">
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- ============ LANDING ============ -->
    <section class="hero" id="top">
      <div class="hero__bg" aria-hidden="true">
        <span class="blob blob--a"></span>
        <span class="blob blob--b"></span>
        <div class="hero__grid"></div>
      </div>
      <canvas class="hero__canvas" id="field" aria-hidden="true"></canvas>

      <div class="wrap hero__inner" id="heroInner">
        <p class="hero__hello mono"><span class="dot"></span><span id="hello">Hi, my name is</span></p>
        <h1 class="hero__name" id="name">Chiner</h1>
        <div class="hero__row">
          <p class="hero__role">
            <span class="hero__role-title" id="role">Developer</span>
            <span class="hero__typed"><span id="typed"></span><span class="caret" aria-hidden="true"></span></span>
          </p>
          <div class="hero__cta">
            <a class="btn btn--primary magnetic" href="#contact">
              <span>Get in touch</span>
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <a class="btn btn--ghost magnetic" href="#about"><span>About me</span></a>
          </div>
        </div>
      </div>

      <a class="hero__scroll mono" href="#about" aria-label="Scroll to About">
        <span>Scroll</span><span class="hero__scroll-line"></span>
      </a>
    </section>

    <!-- ============ ABOUT ============ -->
    <section class="section about" id="about">
      <div class="wrap">
        <header class="section__head">
          <p class="section__num mono reveal">01 / About</p>
          <h2 class="section__title" data-split>A little about me.</h2>
        </header>
        <div class="about__grid">
          <div class="about__portrait reveal">
            <div class="portrait" id="portrait"></div>
          </div>
          <div class="about__body">
            <p class="about__bio" id="bio"></p>
            <dl class="facts" id="facts"></dl>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ SKILLS ============ -->
    <section class="section skills" id="skills">
      <div class="wrap">
        <header class="section__head">
          <p class="section__num mono reveal">02 / Skills</p>
          <h2 class="section__title" data-split>What I work with.</h2>
        </header>
      </div>
      <div class="marquee" id="marquee" aria-hidden="true"></div>
      <div class="wrap">
        <div class="skill-grid" id="skillGrid"></div>
      </div>
    </section>

    <!-- ============ CONTACT ============ -->
    <section class="section contact" id="contact">
      <div class="contact__glow" aria-hidden="true"></div>
      <div class="wrap">
        <header class="section__head">
          <p class="section__num mono reveal">03 / Contact</p>
          <h2 class="section__title section__title--xl" data-split>Let's build something together.</h2>
        </header>
        <div class="contact__mail reveal">
          <a class="mail" id="mail" href="mailto:chinnerbani10@gmail.com">
            <span id="mailText">chinnerbani10@gmail.com</span>
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <button class="copy mono" id="copy" type="button">Copy email</button>
        </div>
        <ul class="socials reveal" id="socials"></ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer__inner mono">
      <span>&copy; <span id="year">2026</span> <span id="footName">Chiner</span></span>
      <a href="#top">Back to top &uarr;</a>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
